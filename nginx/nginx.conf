events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS: with a variable in proxy_pass nginx
    # re-resolves upstream names every `valid=` seconds instead of
    # caching container IPs forever. Without this, recreating the
    # backend/frontend containers (any image update) left nginx
    # proxying to dead IPs — 502 "connect() failed (111: Connection
    # refused)" until a manual nginx restart (found live 2026-10-26).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security test 2026-09-02, finding 7: don't disclose the nginx
    # version in the Server header (Server: nginx, no x.y.z suffix).
    # No server{} block below overrides this.
    server_tokens off;

    server {
        set $umbryx_backend http://backend:8000;
        set $umbryx_frontend http://frontend:80;
        listen 80;
        server_name _;

        client_max_body_size 100M;

        # No-op on a regular single-node install (empty by default) — see
        # nginx/access-control.conf for the multi-node HA use case.
        include /etc/nginx/access-control.conf;

        # SSE streaming — must be before /api/ (regex matches take priority).
        # AI chat stream and live job output both need buffering off and a long
        # read timeout, or the stream arrives in bursts / gets cut mid-job.
        location ~ ^/api/projects/[^/]+/(ai/chats/[^/]+/stream|jobs/[^/]+/output-stream)$ {
            proxy_pass $umbryx_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;
        }

        location /api/ {
            proxy_pass $umbryx_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_connect_timeout 10s;
        }

        location /docs {
            proxy_pass $umbryx_backend;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass $umbryx_backend;
            proxy_set_header Host $host;
        }

        location /ws {
            proxy_pass $umbryx_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location / {
            proxy_pass $umbryx_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /assets/ {
            proxy_pass $umbryx_frontend;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
