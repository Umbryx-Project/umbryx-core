events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS: with a variable in proxy_pass nginx
    # re-resolves upstream names every `valid=` seconds instead of
    # caching container IPs forever. Without this, recreating the
    # backend/frontend containers (any image update) left nginx
    # proxying to dead IPs — 502 "connect() failed (111: Connection
    # refused)" until a manual nginx restart (found live 2026-10-26).
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 100M;

    # Redirect HTTP → HTTPS
    server {
        set $umbryx_backend http://backend:8000;
        set $umbryx_frontend http://frontend:80;
        listen 80;
        include /etc/nginx/access-control.conf;
        return 301 https://$host$request_uri;
    }

    server {
        set $umbryx_backend http://backend:8000;
        set $umbryx_frontend http://frontend:80;
        listen 443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # No-op on a regular single-node install (empty by default) — see
        # nginx/access-control.conf for the multi-node HA use case.
        include /etc/nginx/access-control.conf;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self';" always;

        # WebSocket proxy (must come before /api/)
        location /ws/ {
            proxy_pass $umbryx_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # SSE streaming (must come before /api/)
        location ~ ^/api/projects/[^/]+/jobs/[^/]+/output-stream {
            proxy_pass $umbryx_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 600s;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding on;
        }

        # API proxy
        location /api/ {
            proxy_pass $umbryx_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location /api/uploads/ {
            proxy_pass $umbryx_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        location /uploads/ {
            proxy_pass $umbryx_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }

        # Health check
        location /health {
            proxy_pass $umbryx_backend;
        }

        # Frontend
        location / {
            proxy_pass $umbryx_frontend;
            proxy_set_header Host $host;
        }
    }
}
