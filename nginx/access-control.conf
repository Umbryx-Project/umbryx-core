# Optional per-deployment access control, included by both nginx.conf and
# nginx-ssl.conf inside the main server{} block. Empty by default — every
# regular single-node install is fully open (no allow/deny lines means no
# restriction), exactly as before this file existed.
#
# On a multi-node HA deployment (see docs/modules/HA_DEPLOYMENT.md), the
# team should only ever reach the platform through the HAProxy VIP
# (APP_VIP_PORT) — HAProxy is what actually load-balances/fails over
# between nodes. Each node's own nginx is still directly reachable on its
# own IP unless restricted here, which would let someone bypass the VIP
# (and therefore bypass failover) entirely by hitting a node's real IP
# straight. Restrict it to just the two (or more) HA node IPs — that's
# still everything HAProxy itself needs (it proxies to nginx using each
# node's real IP, not the VIP), while direct outside access to a node's
# own address is refused.
#
# Copy this file to access-control.conf.local (or edit in place — it's
# already the file docker-compose.yml mounts) and uncomment/fill in:
#
#   allow 192.0.2.11;   # node A's real IP
#   allow 192.0.2.12;   # node B's real IP
#   allow 127.0.0.1;        # host-local admin curl/health checks
#   deny all;
#
# Add one more `allow` line per additional HA node. Reload nginx after
# editing (`docker compose restart nginx` — no rebuild needed, this file
# is bind-mounted) for the change to take effect.
