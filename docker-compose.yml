services:
  db:
    image: postgres:16-alpine
    container_name: umbryx_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # B6-6: FTS / search performance tuning.
    # Tune for your host: work_mem governs per-sort-node RAM (affects tsvector
    # ranking), maintenance_work_mem speeds up VACUUM and GIN index builds,
    # parallel workers enable parallel seq-scans on large tables.
    command: >
      postgres
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c max_parallel_workers_per_gather=2
      -c autovacuum_vacuum_scale_factor=0.05
      -c autovacuum_analyze_scale_factor=0.02
      -c random_page_cost=1.1
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  redis:
    # Pinned to the 7.2 line, not the floating "7-alpine" tag: Redis Ltd
    # relicensed everything from 7.4 onward to RSALv2/SSPLv1 (source-available,
    # not OSI open source) in March 2024. 7.2.x is the last release still
    # under the original BSD-3-Clause license. See docs/modules/HANDS_ON.md
    # for the full license audit this came out of.
    image: redis:7.2-alpine
    container_name: umbryx_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-change_me_redis_pw}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me_redis_pw}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M

  backend:
    build: ./backend
    # image: is only consulted when no local build context is rebuilt (e.g.
    # `docker compose pull` on a deploy host that has no source checkout) —
    # local dev keeps using `docker compose build`, which still builds from
    # ./backend and tags the result as this same name. Set BACKEND_IMAGE /
    # IMAGE_TAG in the environment (CI's deploy-test-infra stage does this)
    # to point at the GitLab Container Registry instead of the local build.
    image: ${BACKEND_IMAGE:-umbryx-backend}:${IMAGE_TAG:-latest}
    container_name: umbryx_backend
    restart: unless-stopped
    dns:
      - ${DNS_SERVER_1:-8.8.8.8}
      - ${DNS_SERVER_2:-1.1.1.1}
    environment:
      # DB_HOST/DB_PORT default to the local compose `db` service; override
      # in .env to point at an external cluster (e.g. the pg_auto_failover
      # + HAProxy VIP) without needing a docker-compose.yml edit per host.
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME}?sslmode=${DB_SSLMODE:-prefer}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_me_redis_pw}@redis:6379/0
      # redis_factory.py's Sentinel path reads this as its own variable
      # (Sentinel gives back a master host:port, not a full URL with
      # embedded credentials) — REDIS_URL alone doesn't cover it even
      # though the password is the same value either way.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me_redis_pw}
      UPLOAD_ROOT: /data/uploads
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      APP_ENV: ${APP_ENV:-dev}
      # Lab stands run infra services with self-signed certs (Adaptix's
      # server.rsa.crt etc.) — tls.infra_tls_verify() reads this, but it
      # was never wired through to the container, so the .env opt-out
      # silently did nothing and every health probe died on
      # CERTIFICATE_VERIFY_FAILED -> "unreachable" (found live, test55).
      INFRA_TLS_VERIFY: ${INFRA_TLS_VERIFY:-true}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-8}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Server-side base for the OIDC redirect_uri (core/config.py) — unset
      # falls back to the incoming request's own Host header, which is
      # unsafe behind a spoofable proxy and, in the HA topology, ties the
      # registered redirect_uri to whichever node happens to answer first.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET:-}
      # HMAC key for instance-to-instance sync (/api/sync/*) — must be the
      # identical value on every instance that syncs with each other.
      # sync_api.py returns 403 "Sync is not configured" while this is
      # empty. Was read via os.environ but never actually wired through
      # from the .env file to the container (found deploying a live
      # 2-instance sync test, 2026-09-07).
      SYNC_SIGNING_KEY: ${SYNC_SIGNING_KEY:-}
      # ── HA Configuration ──────────────────────────────────────────────
      # Empty by default (single-instance Redis via REDIS_URL above).
      # redis_factory.py prefers Sentinel over REDIS_URL whenever
      # REDIS_SENTINEL_HOSTS is non-empty — set these three in .env to
      # point at a real Sentinel quorum instead of editing this file.
      REDIS_SENTINEL_HOSTS: ${REDIS_SENTINEL_HOSTS:-}
      REDIS_SENTINEL_MASTER: ${REDIS_SENTINEL_MASTER:-mymaster}
      REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:-}
      # Empty by default — GET /api/system/ha (System → HA Cluster in the
      # UI) reports pg_auto_failover node state only when this is set; a
      # regular single-node deployment just gets `enabled: false`, not an
      # error. Points at the pg_auto_failover MONITOR (a separate small
      # Postgres instance, not the app's own database) using a dedicated
      # read-only role — see docs/modules/HA_DEPLOYMENT.md's bootstrap
      # step for creating it.
      HA_MONITOR_HOST: ${HA_MONITOR_HOST:-}
      HA_MONITOR_PORT: ${HA_MONITOR_PORT:-5433}
      HA_MONITOR_DB: ${HA_MONITOR_DB:-pg_auto_failover}
      HA_MONITOR_USER: ${HA_MONITOR_USER:-umbryx_monitor}
      HA_MONITOR_PASSWORD: ${HA_MONITOR_PASSWORD:-}
      # DATABASE_REPLICA_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@replica:5432/${DB_NAME}"
      # DATABASE_POOL_SIZE: "20"
      # DATABASE_MAX_OVERFLOW: "40"
      # DATABASE_POOL_RECYCLE: "1800"
      # DATABASE_STATEMENT_TIMEOUT: "30000"
      REGISTRY_URL: ${REGISTRY_URL:-http://registry:5000}
      REGISTRY_EXTERNAL_URL: ${REGISTRY_EXTERNAL_URL:-}
      REGISTRY_USER: ${REGISTRY_USER:-umbryx}
      REGISTRY_PASS: ${REGISTRY_PASS:-}
      DOCKER_HOST: ${DOCKER_HOST:-unix:///var/run/docker.sock}
    volumes:
      # DATA_DIR defaults to ./data (relative to wherever this compose
      # file is run from) for local dev — unchanged. Deploy jobs that run
      # from an ephemeral checkout (e.g. a fresh CI git clone) should
      # still override this to an absolute, persistent host path — a
      # fresh empty dir every run means a fresh admin password / secret
      # keys every run, not a permissions problem: the backend
      # entrypoint (scripts/docker-entrypoint.sh) fixes ownership of
      # whatever gets mounted here automatically on every start, even if
      # Docker auto-created it as root because it didn't exist yet.
      - ${DATA_DIR:-./data}:/data
      - ./modules:/app/modules:ro
      # License hwid anchors (docs/modules/LICENSING_REDESIGN.md): expose the
      # host's real machine identity read-only so license binding isn't limited
      # to the copyable install_uuid. Optional — the backend reads them
      # best-effort and still starts if a path is absent (e.g. product_uuid
      # needs a bare-metal/VM host; it's typically hidden on managed hosts).
      - /etc/machine-id:/host/machine-id:ro
      - /sys/class/dmi/id/product_uuid:/host/product_uuid:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M

  frontend:
    build: ./frontend
    image: ${FRONTEND_IMAGE:-umbryx-frontend}:${IMAGE_TAG:-latest}
    container_name: umbryx_frontend
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  nginx:
    image: nginx:alpine
    container_name: umbryx_nginx
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
      # Uncomment for HTTPS — run nginx/gen-certs.sh first, then swap nginx.conf → nginx-ssl.conf below
      # - "${HTTPS_PORT:-3443}:443"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./nginx/nginx-ssl.conf:/etc/nginx/nginx.conf:ro  # swap this line to enable HTTPS
      # - ./nginx/certs:/etc/nginx/certs:ro                # needed for HTTPS
      # Empty by default (no-op) — edit for a multi-node HA deployment to
      # restrict direct node access to just the HA peer IPs, so the team
      # only ever reaches the platform through the HAProxy VIP. See
      # nginx/access-control.conf and docs/modules/HA_DEPLOYMENT.md.
      - ./nginx/access-control.conf:/etc/nginx/access-control.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  # ── Optional arq worker (B6-5 / B8-8) ────────────────────────────────────
  # Enable to run CPU/IO-bound jobs (nmap, nuclei, donpapi …) outside the API
  # process so the API stays responsive under heavy scan load.
  #
  # How to enable:
  #   1. Uncomment this service block.
  #   2. Add  WORKER_BACKEND=arq  to the backend service environment section.
  #   3. docker compose build worker && docker compose up -d worker backend
  #
  # worker:
  #   build: ./backend
  #   container_name: umbryx_worker
  #   restart: unless-stopped
  #   command: ["arq", "app.core.arq_worker.WorkerSettings"]
  #   environment:
  #     DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
  #     REDIS_URL: redis://:${REDIS_PASSWORD:-change_me_redis_pw}@redis:6379/0
  #     UPLOAD_ROOT: /data/uploads
  #     ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  #     APP_ENV: ${APP_ENV:-dev}
  #     WORKER_POOL_MAX_WORKERS: ${WORKER_POOL_MAX_WORKERS:-8}
  #   volumes:
  #     - ./data/uploads:/data/uploads
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "2.0"
  #         memory: 512M

  # ── Optional PgBouncer connection pooler (B6-4) ───────────────────────────
  # Adds a transaction-mode connection pool in front of PostgreSQL.
  # Reduces DB connection overhead when running multiple backend replicas or
  # under heavy concurrent API load (200+ simultaneous requests).
  #
  # How to enable:
  #   1. Uncomment this service block.
  #   2. Change the backend DATABASE_URL above to:
  #        postgresql://${DB_USER}:${DB_PASSWORD}@pgbouncer:5432/${DB_NAME}
  #   3. docker compose up -d pgbouncer backend
  #
  # Notes:
  #   - Uses transaction pooling mode — compatible with SQLAlchemy async.
  #   - Default pool: 25 server connections, up to 200 client connections.
  #   - PgBouncer runs on port 5432 internally; PostgreSQL is still on 5432
  #     inside the `db` container (different hostname, no port conflict).
  #   - Set PGBOUNCER_POOL_SIZE / PGBOUNCER_MAX_CLIENT_CONN in .env to tune.
  #
  # pgbouncer:
  #   image: bitnami/pgbouncer:1
  #   container_name: umbryx_pgbouncer
  #   restart: unless-stopped
  #   environment:
  #     POSTGRESQL_HOST: db
  #     POSTGRESQL_PORT: 5432
  #     POSTGRESQL_USERNAME: ${DB_USER}
  #     POSTGRESQL_PASSWORD: ${DB_PASSWORD}
  #     POSTGRESQL_DATABASE: ${DB_NAME}
  #     PGBOUNCER_AUTH_TYPE: scram-sha-256
  #     PGBOUNCER_POOL_MODE: transaction
  #     PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-25}
  #     PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
  #     PGBOUNCER_IGNORE_STARTUP_PARAMETERS: extra_float_digits
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USER}"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "0.25"
  #         memory: 64M

volumes:
  pgdata:
