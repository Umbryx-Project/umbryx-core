server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security test 2026-09-02, finding 7: no version in Server header.
    server_tokens off;

    # Security test 2026-09-02, finding 3: the SPA layer serves /, JS/CSS
    # bundles, robots.txt etc. directly — the backend's
    # _SecurityHeadersMiddleware never sees those responses. Values are kept
    # VERBATIM in sync with backend/app/main.py::_SecurityHeadersMiddleware;
    # if you change one side, change the other.
    # `always` keeps headers on 4xx/5xx responses too, not only 2xx.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection 0 always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
