# workstations.py's _spawn_tracked call sites sit behind the EE license
# gate — unreachable (and untestable) in CE builds. pragma excludes them
# from coverage.py's report, but SonarQube counts absent lines as
# uncovered; excluding the file keeps the gate honest about what CE can
# actually exercise.
sonar.coverage.exclusions=backend/app/routers/workstations.py
