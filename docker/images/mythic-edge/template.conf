# Upstreams resolve lazily (via variables), so the edge can boot before the
# hasura/server pods are ready instead of failing on startup DNS resolution.
resolver 10.43.0.10 valid=5s ipv6=off;

server {
    listen 7443 ssl;
    ssl_certificate /etc/nginx/tls.crt;
    ssl_certificate_key /etc/nginx/tls.key;
    client_max_body_size 0;

    location /graphql/ {
        set $hasura_upstream "http://${HASURA_HOST}:${HASURA_PORT}";
        proxy_pass $hasura_upstream/v1/graphql;
        proxy_set_header Host $host;
    }
    location /v1/ {
        set $hasura_upstream "http://${HASURA_HOST}:${HASURA_PORT}";
        proxy_pass $hasura_upstream;
    }
    location /api/v1.4/ {
        set $server_upstream "http://${SERVER_HOST}:${SERVER_PORT}";
        proxy_pass $server_upstream;
    }
    location / {
        set $server_upstream "http://${SERVER_HOST}:${SERVER_PORT}";
        proxy_pass $server_upstream;
        proxy_ssl_verify off;
    }
}
