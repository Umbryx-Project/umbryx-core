server {
    listen 7443 ssl;
    ssl_certificate /etc/mythic/tls.crt;
    ssl_certificate_key /etc/mythic/tls.key;
    client_max_body_size 0;
    location /graphql/ {
        proxy_pass http://127.0.0.1:8080/v1/graphql;
        proxy_set_header Host $host;
    }
    location /v1/ { proxy_pass http://127.0.0.1:8080/v1/; }
    location /api/v1.4/ { proxy_pass http://127.0.0.1:17443/api/v1.4/; }
    location / { proxy_pass http://127.0.0.1:17443/; }
}
